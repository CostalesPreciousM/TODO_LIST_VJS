<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Manager</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        .completed .task-text {
            text-decoration: line-through;
        }
        .text-danger {
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container mt-4">
        <h2>Task Manager</h2>
        <div class="input-group mb-3">
            <input type="text" id="taskInput" class="form-control" placeholder="New Task">
            <input type="date" id="dueDateInput" class="form-control">
            <select id="prioritySelect" class="form-select">
                <option value="high">High</option>
                <option value="medium" selected>Medium</option>
                <option value="low">Low</option>
            </select>
            <button id="addTaskButton" class="btn btn-primary">Add Task</button>
        </div>
        <ul id="taskList" class="list-group"></ul>
    </div>

    <script src="script.js"></script>
</body>
</html>
